name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: リポジトリの取得
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: テストの実行
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            if [ -d src ] || [ -d test ]; then
              echo "src/ または test/ があるのに package.json がありません。" >&2
              exit 1
            fi
            echo "テスト対象がまだないため、このステップは何もしません。"
            exit 0
          fi
          node -e 'const p = require("./package.json"); if (!p.scripts || !p.scripts.test) { console.error("package.json に scripts.test がありません。"); process.exit(1); }'
          npm ci
          npm test
